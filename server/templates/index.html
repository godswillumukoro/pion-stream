<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pion-stream — LIVE VIEWER</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--border:#252525;--accent:#4af626;--red:#ff2a2a;--text:#eaeaea;--text-dim:#6b6b6b;--font-mono:'JetBrains Mono',monospace;--font-display:'Archivo',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);min-height:100dvh;display:flex;flex-direction:column;align-items:center}
.frame{width:100%;max-width:1024px;min-height:100dvh;padding:32px 24px 48px;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--border)}
.brand{font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:-.5px;text-transform:uppercase}
.brand-accent{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:16px}
.badge{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border:1px solid var(--border);background:var(--surface)}
.badge-dot{width:6px;height:6px;background:var(--text-dim)}
#status-badge.live .badge-dot{background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#status-badge.live{border-color:rgba(255,42,42,.4)}
.badge-label.offline{color:var(--text-dim)}
.badge-label.live{color:var(--red)}
.viewers{font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border:1px solid var(--border);background:var(--surface)}
.stage{flex:1;margin-top:1px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:400px}
.video-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.stage video{max-width:100%;max-height:100%;background:#000}
.offline-msg{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;position:absolute;inset:0;z-index:5;justify-content:center}
.hidden{display:none!important}
.footer{display:flex;align-items:center;justify-content:space-between;padding-top:16px;font-size:10px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--border)}
.footer-left{display:flex;gap:24px}
.footer-item{display:flex;gap:8px}
.footer-label{opacity:.5}
.error-overlay{position:absolute;inset:0;background:rgba(10,10,10,.92);display:flex;align-items:center;justify-content:center;z-index:10;font-size:12px;color:var(--red);letter-spacing:.05em;text-transform:uppercase;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="frame">
<div class="header">
<div class="brand">pion<span class="brand-accent">-stream</span></div>
<div class="header-right">
<span id="status-badge" class="badge" hx-get="/status" hx-trigger="load, every 5s" hx-swap="outerHTML"><span class="badge-dot"></span><span class="badge-label offline">OFFLINE</span></span>
<span id="viewer-count" class="viewers">&mdash;</span>
</div>
</div>
<div class="stage" id="stage">
<div class="video-wrap"><video id="stream-video" autoplay playsinline muted></video></div>
<div id="offline-msg" class="offline-msg"><span>[ AWAITING UPLINK ]</span><span class="indicator">Publish via OBS WHIP or Browser Studio</span></div>
<div id="error-overlay" class="error-overlay hidden"></div>
</div>
<div class="footer">
<div class="footer-left">
<div class="footer-item"><span class="footer-label">PROTOCOL</span><span>WHIP/WHEP</span></div>
<div class="footer-item"><span class="footer-label">ENGINE</span><span>PION v4</span></div>
</div>
<div id="footer-status" class="footer-item"><span class="footer-label">UPLINK</span><span>NO CARRIER</span></div>
</div>
</div>
<script>
(function(){
var pc=null, video=document.getElementById('stream-video'),
    offline=document.getElementById('offline-msg'),
    errEl=document.getElementById('error-overlay'), wasLive=false;
function log(m){console.log('[viewer]',m)}

document.body.addEventListener('htmx:afterSwap',function(e){
  if(e.detail.target.id!=='status-badge')return;
  var live=e.detail.target.classList.contains('live');
  log('HTMX live='+live+' wasLive='+wasLive);
  if(live&&!wasLive){wasLive=true;doConnect();}
  else if(!live&&wasLive){wasLive=false;doDisconnect();}
});

async function doConnect(){
  log('connect start');
  try{
    pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    var ms=null;
    pc.ontrack=function(e){
      log('ONTRACK '+e.track.kind+' streams='+e.streams.length);
      if(e.streams&&e.streams[0])ms=e.streams[0];
      else{if(!ms)ms=new MediaStream();ms.addTrack(e.track);}
      video.srcObject=ms;
      offline.classList.add('hidden');
      errEl.classList.add('hidden');
      log('srcObject set, video.readyState='+video.readyState);
    };
    pc.oniceconnectionstatechange=function(){
      log('ICE:'+pc.iceConnectionState);
      if(pc&&(pc.iceConnectionState==='failed'||pc.iceConnectionState==='disconnected')){
        errEl.textContent='[ SIGNAL LOST ]';errEl.classList.remove('hidden');
      }
    };
    pc.addTransceiver('video',{direction:'recvonly'});
    pc.addTransceiver('audio',{direction:'recvonly'});
    var offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    var resp=await fetch('/api/whep',{method:'POST',headers:{'Content-Type':'application/sdp'},body:pc.localDescription.sdp});
    log('WHEP '+resp.status);
    if(!resp.ok)throw new Error('WHEP '+resp.status);
    await pc.setRemoteDescription({type:'answer',sdp:await resp.text()});
    log('connected');
  }catch(e){log('ERR:'+e.message);doDisconnect();}
}
function doDisconnect(){
  log('disconnect');
  if(pc){pc.close();pc=null;}
  video.srcObject=null;
  offline.classList.remove('hidden');
  errEl.classList.add('hidden');
}
})();
</script>
</body>
</html>
